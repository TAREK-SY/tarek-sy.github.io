<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | Tarek Nassan</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#fafaf9" />

    <script>
      (function () {
        var d = document.documentElement;
        try {
          var theme = localStorage.getItem("tn.theme");
          if (theme !== "light" && theme !== "dark") {
            theme = matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          d.dataset.theme = theme;
        } catch (e) {
          d.dataset.theme = "light";
        }
      })();
    </script>

    <link rel="stylesheet" href="/assets/css/fonts.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/site.css" />
  </head>

  <body>
    <main class="shell state" style="min-height: 100dvh; display: grid; align-content: center">
      <h2>Page not found</h2>
      <p>That address does not exist on this site.</p>
      <p><a class="btn btn-primary" href="/">Back to the home page</a></p>
    </main>
  </body>
</html>
