<!doctype html>
<html lang="en" dir="ltr" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Project | Tarek Nassan</title>
    <meta name="description" content="Project case study." />
    <meta name="theme-color" content="#fafaf9" />
    <meta name="robots" content="index, follow" />

    <script>
      (function () {
        var d = document.documentElement;
        try {
          var lang = localStorage.getItem("tn.lang");
          if (lang !== "en" && lang !== "ar") {
            lang = (navigator.language || "en").indexOf("ar") === 0 ? "ar" : "en";
          }
          d.lang = lang;
          d.dir = lang === "ar" ? "rtl" : "ltr";

          var theme = localStorage.getItem("tn.theme");
          if (theme !== "light" && theme !== "dark") {
            theme = matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          d.dataset.theme = theme;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = theme === "dark" ? "#0c0c0b" : "#fafaf9";
        } catch (e) {
          d.dataset.theme = "light";
        }
      })();
    </script>

    <link
      rel="preload"
      href="assets/fonts/geist-latin-100-900.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="assets/css/fonts.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/site.css" />
  </head>

  <body>
    <a class="skip-link" href="#app" data-skip>Skip to content</a>
    <div data-nav-sentinel aria-hidden="true"></div>

    <header class="nav">
      <div class="shell nav-inner">
        <a class="nav-brand" href="index.html" data-nav-brand>Tarek Nassan</a>
        <div class="nav-tools" style="margin-inline-start: auto">
          <button
            class="icon-btn lang-btn"
            type="button"
            data-lang-toggle
            aria-label="Switch language"
          >
            ع
          </button>
          <button
            class="icon-btn"
            type="button"
            data-theme-toggle
            aria-label="Switch theme"
          ></button>
        </div>
      </div>
    </header>

    <main id="app">
      <div class="shell case-head">
        <div class="skeleton" style="height: 3rem; max-width: 20rem"></div>
        <div class="skeleton" style="height: 8rem; margin-block-start: 2rem"></div>
      </div>
    </main>

    <dialog class="lightbox" id="lightbox" aria-label="Screenshot viewer">
      <div class="lightbox-bar">
        <span class="mono" data-counter></span>
        <button class="icon-btn" type="button" data-close aria-label="Close"></button>
      </div>
      <div class="lightbox-stage" data-stage></div>
      <div class="lightbox-nav">
        <button class="icon-btn" type="button" data-prev aria-label="Previous"></button>
        <button class="icon-btn" type="button" data-next aria-label="Next"></button>
      </div>
    </dialog>

    <noscript>
      <div class="shell state">
        <h2>This page needs JavaScript</h2>
        <p>
          Case study content is loaded from a data file.
          <a href="index.html">Return to the home page</a>.
        </p>
      </div>
    </noscript>

    <script type="module" src="assets/js/case.js"></script>
  </body>
</html>
